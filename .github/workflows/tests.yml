name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The CPU wheel is a fraction of the size of the default CUDA build and
      # is all the default suite needs. GPU and smoke tests are opt-in and are
      # not run here.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Pare and pytest
        run: pip install -e . pytest

      - name: Run tests
        run: pytest

      - name: Check README numbers against results
        run: python scripts/check_readme_numbers.py
